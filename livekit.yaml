apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbb-cr1
  namespace: mbb-space1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
      - name: livekit
        image: livekit/livekit-server:latest
        args: ["--config", "config/config.yaml"]
        env:
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: livekit-secret
              key: apiKey
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: livekit-secret
              key: apiSecret
        volumeMounts:
        - name: config-volume
          mountPath: config  # Mount config directory
      volumes:
      - name: config-volume
        configMap:
          name: livekit-config

---
apiVersion: v1
kind: Service
metadata:
  name: mbb-cr-service1
  namespace: mbb-space1
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:741448958009:certificate/3e5a013b-7e82-40f0-97e4-be3e8db8977f"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 7880
    - name: https
      port: 443
      targetPort: 7880
  selector:
    app: livekit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mbb-cr-ingress1
  namespace: mbb-space1
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:741448958009:certificate/3e5a013b-7e82-40f0-97e4-be3e8db8977f"
spec:
  rules:
    - host: "old-hlk.sazzadhossen.online"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-service
                port:
                  number: 80
  tls:
    - hosts:
        - "old-hlk.sazzadhossen.online"
      secretName: livekit-tls
